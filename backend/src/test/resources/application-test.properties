# Test profile (@ActiveProfiles("test")): in-memory H2 in PostgreSQL mode, Flyway migrations (same as production),
# jobs executed inline, no network: AI is faked, Google providers are the demo mocks where a test needs them.
pitsch.mode=test
spring.config.import=
# CI also runs this suite against PostgreSQL: TEST_DB_URL=jdbc:postgresql://..., TEST_DDL_AUTO=validate.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
# Flyway owns the schema. Hibernate validation is exact on PostgreSQL; H2 reports TEXT as CLOB, so it is skipped there.
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:none}
pitsch.jobs.inline=true
pitsch.jobs.enabled=true
pitsch.ai.base-url=http://127.0.0.1:1
pitsch.ai.max-attempts=1
pitsch.ai.internal-token=test-internal-token-test-internal-token
pitsch.security.jwt-secret=test-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz
pitsch.security.encryption-keys=t1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
pitsch.security.password-hash-iterations=1000
pitsch.security.require-email-verification=false
pitsch.security.cookie-secure=false
pitsch.rate-limit.auth-per-minute=1000
pitsch.rate-limit.api-per-minute=100000
pitsch.rate-limit.ai-per-minute=1000
pitsch.storage.provider=local
pitsch.storage.local-dir=${java.io.tmpdir}/pitsch-test-files
pitsch.mail.provider=log
pitsch.frontend-url=http://localhost:5173
pitsch.cors.allowed-origins=http://localhost:5173
management.server.port=
logging.level.com.pitsch=INFO
pitsch.security.refresh-reuse-grace-seconds=0
