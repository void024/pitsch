# Test configuration: in-memory database, no .env, demo user seeded.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
pitsch.ai.base-url=http://127.0.0.1:1
pitsch.ai.max-attempts=1
pitsch.demo.seed-user=true
