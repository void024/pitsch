spring.application.name=pitsch-backend
server.port=${PORT:8080}

# Values can come from environment variables or from backend/.env (see .env.example).
spring.config.import=optional:file:.env[.properties]

# ---- Database ----
# Default: a local H2 file database (zero setup, good for demos).
# For PostgreSQL set DB_URL=jdbc:postgresql://localhost:5432/pitsch, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pitsch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Pitsch AI service (FastAPI, ai-service/) ----
pitsch.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
pitsch.ai.connect-timeout-seconds=5
# Research can take a couple of minutes (several web searches + LLM calls).
pitsch.ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:240}
pitsch.ai.max-attempts=3
pitsch.ai.retry-backoff-millis=2000

# ---- Auth ----
# CHANGE THIS for anything other than local development (at least 32 random characters).
pitsch.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
pitsch.jwt.ttl-hours=${JWT_TTL_HOURS:24}
# Creates demo@pitsch.com / pitsch123 on startup if it doesn't exist.
pitsch.demo.seed-user=${SEED_DEMO_USER:true}

# ---- Frontend / CORS ----
pitsch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
pitsch.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- Workflow defaults ----
pitsch.default-timezone=${DEFAULT_TIMEZONE:Asia/Kolkata}
pitsch.workflow.threads=4
# Gmail / Google Calendar / Google Sheets actions are executed in "simulated" mode: labels, sent emails,
# pipeline rows and meetings are recorded in Pitsch (and meetings appear in the Pitsch calendar),
# but nothing is sent to Google until real integrations are added.
pitsch.integrations.mode=simulated

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=30MB
spring.mvc.async.request-timeout=300000
