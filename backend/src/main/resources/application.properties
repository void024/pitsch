# ==============================================================================================
# Pitsch backend configuration. Every value can be set through an environment variable.
# PITSCH_MODE selects behaviour: production (default) | development | demo.
#   production  - strict: PostgreSQL, real Google providers, required secrets, fail fast on misconfiguration
#   development - local work: H2 allowed, generated dev secrets, emails logged instead of sent
#   demo        - development + mock Google providers + seeded demo workspace (clearly labelled in the UI)
# Mode-specific defaults live in application-<mode>.properties.
# ==============================================================================================
spring.application.name=pitsch-backend
spring.profiles.active=${PITSCH_MODE:production}
pitsch.mode=${PITSCH_MODE:production}
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Trust X-Forwarded-* only from the platform load balancer (Render/Fly/ALB all set them).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Database (PostgreSQL in every real environment) ----
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pitsch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Migrations (Flyway). Existing pre-Flyway databases are baselined at V1. ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---- Public URLs ----
pitsch.frontend-url=${FRONTEND_URL:http://localhost:5173}
pitsch.public-api-url=${PUBLIC_API_URL:http://localhost:8080}
pitsch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Authentication & security ----
pitsch.security.jwt-secret=${JWT_SECRET:}
pitsch.security.jwt-issuer=${JWT_ISSUER:pitsch}
pitsch.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
pitsch.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
pitsch.security.password-hash-iterations=${PASSWORD_HASH_ITERATIONS:600000}
pitsch.security.max-failed-logins=${MAX_FAILED_LOGINS:5}
pitsch.security.lockout-minutes=${LOCKOUT_MINUTES:15}
pitsch.security.refresh-reuse-grace-seconds=${REFRESH_REUSE_GRACE_SECONDS:20}
pitsch.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
pitsch.security.cookie-secure=${COOKIE_SECURE:true}
pitsch.security.cookie-same-site=${COOKIE_SAME_SITE:Lax}
pitsch.security.cookie-domain=${COOKIE_DOMAIN:}
# Comma-separated "keyId:base64(32 bytes)" entries; the first is used for new encryptions.
pitsch.security.encryption-keys=${PITSCH_ENCRYPTION_KEYS:}

# ---- Rate limits (per instance; account lockout is database-backed and global) ----
pitsch.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
pitsch.rate-limit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:600}
pitsch.rate-limit.ai-per-minute=${RATE_LIMIT_AI_PER_MINUTE:30}

# ---- Pitsch AI service (FastAPI, ai-service/) ----
pitsch.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
pitsch.ai.internal-token=${AI_SERVICE_TOKEN:}
pitsch.ai.connect-timeout-seconds=5
pitsch.ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:240}
pitsch.ai.max-attempts=3
pitsch.ai.retry-backoff-millis=2000

# ---- Google (Gmail, Calendar, Sheets, optional sign-in) ----
pitsch.google.client-id=${GOOGLE_CLIENT_ID:}
pitsch.google.client-secret=${GOOGLE_CLIENT_SECRET:}
pitsch.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
pitsch.google.login-enabled=${GOOGLE_LOGIN_ENABLED:false}
pitsch.google.pubsub-topic=${GOOGLE_PUBSUB_TOPIC:}
pitsch.google.pubsub-audience=${GOOGLE_PUBSUB_AUDIENCE:}
pitsch.google.pubsub-service-account=${GOOGLE_PUBSUB_SERVICE_ACCOUNT:}
pitsch.google.gmail-sync-interval-minutes=${GMAIL_SYNC_INTERVAL_MINUTES:10}
pitsch.google.gmail-ingest-query=${GMAIL_INGEST_QUERY:in:inbox -category:promotions -category:social -category:forums}
pitsch.google.api-timeout-seconds=${GOOGLE_API_TIMEOUT_SECONDS:20}

# ---- File storage (S3-compatible in production) ----
pitsch.storage.provider=${STORAGE_PROVIDER:s3}
pitsch.storage.local-dir=${STORAGE_LOCAL_DIR:./data/files}
pitsch.storage.s3.bucket=${S3_BUCKET:}
pitsch.storage.s3.region=${S3_REGION:auto}
pitsch.storage.s3.endpoint=${S3_ENDPOINT:}
pitsch.storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:}
pitsch.storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
pitsch.storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
pitsch.storage.s3.path-style=${S3_PATH_STYLE:false}
pitsch.storage.signed-url-minutes=${SIGNED_URL_MINUTES:10}

# ---- Uploads ----
pitsch.uploads.max-file-mb=${UPLOAD_MAX_FILE_MB:15}
pitsch.uploads.max-files=${UPLOAD_MAX_FILES:10}
pitsch.uploads.max-pptx-uncompressed-mb=${UPLOAD_MAX_PPTX_UNCOMPRESSED_MB:150}
pitsch.uploads.max-zip-entries=${UPLOAD_MAX_ZIP_ENTRIES:3000}
pitsch.malware.scanner=${MALWARE_SCANNER:none}
pitsch.malware.clamav-host=${CLAMAV_HOST:localhost}
pitsch.malware.clamav-port=${CLAMAV_PORT:3310}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB
server.tomcat.max-swallow-size=40MB

# ---- Transactional email ----
pitsch.mail.provider=${MAIL_PROVIDER:smtp}
pitsch.mail.from=${MAIL_FROM:Pitsch <no-reply@pitsch.app>}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ---- Background jobs (PostgreSQL-backed queue, see docs/ARCHITECTURAL_DECISIONS.md ADR-004) ----
pitsch.jobs.enabled=${JOBS_ENABLED:true}
pitsch.jobs.threads=${JOB_THREADS:4}
pitsch.jobs.poll-interval-ms=${JOB_POLL_INTERVAL_MS:1000}
pitsch.jobs.lock-timeout-minutes=${JOB_LOCK_TIMEOUT_MINUTES:20}
pitsch.jobs.inline=false

# ---- Billing (Stripe optional; without it every workspace uses its plan from the database) ----
pitsch.billing.provider=${BILLING_PROVIDER:none}
pitsch.billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
pitsch.billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
pitsch.billing.stripe-price-ids=${STRIPE_PRICE_IDS:}

# ---- Privacy / retention ----
pitsch.retention.agent-io-days=${AGENT_IO_RETENTION_DAYS:90}
pitsch.retention.audit-days=${AUDIT_RETENTION_DAYS:730}

# ---- Defaults for new workspaces ----
pitsch.default-timezone=${DEFAULT_TIMEZONE:UTC}

# ---- API documentation ----
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/api/docs
springdoc.paths-to-match=/api/v1/**

# ---- Observability ----
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=pitsch-backend
management.info.env.enabled=false
