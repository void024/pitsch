# Demo defaults (PITSCH_MODE=demo): mock Google providers and a seeded demo workspace.
# Every mock action is labelled "Demo" in the UI and in the audit log; nothing leaves Pitsch.
pitsch.security.cookie-secure=${COOKIE_SECURE:false}
pitsch.security.password-hash-iterations=${PASSWORD_HASH_ITERATIONS:210000}
pitsch.storage.provider=${STORAGE_PROVIDER:local}
pitsch.mail.provider=${MAIL_PROVIDER:log}
pitsch.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
pitsch.default-timezone=${DEFAULT_TIMEZONE:Asia/Kolkata}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
management.server.port=${MANAGEMENT_PORT:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
