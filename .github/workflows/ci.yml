# Continuous integration. No job needs real Gemini, Tavily, Google or Stripe credentials:
# the backend uses a fake AI client, the AI service mocks the LLM, the frontend E2E mocks the API.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify

  backend-postgres:
    # Same suite against PostgreSQL 16: Flyway migrations + Hibernate schema validation on the real dialect.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pitsch_test, POSTGRES_USER: pitsch, POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pitsch" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/pitsch_test
      TEST_DB_USERNAME: pitsch
      TEST_DB_PASSWORD: ci-only-password
      TEST_DDL_AUTO: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B test

  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai-service/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Offline evals (fail on threshold regressions)
        run: python -m evals.run_evals --suite offline --report eval-report.json
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: ai-service/eval-report.json, retention-days: 30 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (production + dev dependencies)
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit
        working-directory: ai-service
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Filesystem vulnerability scan (Maven, npm, pip, Dockerfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker:
    needs: [frontend, backend, ai-service]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: pitsch-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
